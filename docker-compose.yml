services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: legalassist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # SECURITY: Do NOT expose port 5432 publicly — database was hacked!
    # ports:
    #   - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python init_tables.py && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/legalassist
      SECRET_KEY: change-me-to-a-random-secret-key-in-production
      AI_API_KEY: ""
      AI_MODEL: gemini-2.5-flash
      EMBEDDING_MODEL: intfloat/multilingual-e5-base
      STORAGE_DIR: /app/storage
      MAX_UPLOAD_BYTES: "52428800"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://201.51.9.240:3000
      VERTEX_AI_PROJECT: "gen-lang-client-0615048966"
      VERTEX_AI_LOCATION: "us-central1"
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials.json
      # ВРЕМЕННО для демо: авторизация отключена. Когда добавите реальный auth —
      # удалите эту строку (в коде дефолт DEV_BYPASS=false, auth включится).
      DEV_BYPASS: "true"
    volumes:
      - ./backend:/app
      - backend_storage:/app/storage
      - chroma_data:/app/storage/chroma_db
      - ./gen-lang-client-0615048966-f1a99d998ddf.json:/app/credentials.json:ro
      - ./enriched_laws_200upk.jsonl:/app/enriched_laws_200upk.jsonl:ro
      - ./unified_laws_200upk.jsonl:/app/unified_laws_200upk.jsonl:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://201.51.9.240:8000
      HOSTNAME: "0.0.0.0"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

volumes:
  pgdata:
  backend_storage:
  chroma_data:
